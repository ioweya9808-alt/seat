<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>座位表</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100dvh;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;
}

body{
    display:flex;
    flex-direction:column;
}

.topbar{
    height:90px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px;
}

.title{
    font-size:clamp(30px,3vw,54px);
    font-weight:700;
}

.tools{
    display:flex;
    gap:10px;
}

.btn{
    padding:12px 20px;
    font-size:22px;
    border:none;
    border-radius:12px;
    background:#2348aa;
    color:white;
    cursor:pointer;
}

.btn:hover{
    background:#3567df;
}

.desk{
    text-align:center;
    background:#446bb0;
    font-size:clamp(36px,4vw,60px);
    font-weight:bold;
    padding:10px;
    border-top:1px solid #90a7d3;
    border-bottom:1px solid #90a7d3;
}

#seatGrid{
    flex:1;

    min-height:0;

    display:grid;

    grid-template-columns:
    repeat(7,1fr);

    grid-template-rows:
    repeat(5,1fr);

    gap:2px;

    background:#3d4d74;
}

.seat{
    background:#121a2b;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:6px;
}

.chip{

    width:96%;
    height:94%;

    border-radius:12px;

    border:1px solid #254da6;

    background:#06152d;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    cursor:grab;

    user-select:none;
}

.chip:active{
    cursor:grabbing;
}

.num{
    font-size:clamp(16px,1.3vw,24px);
    font-weight:bold;
}

.name{
    font-size:clamp(28px,2.6vw,42px);
    text-align:center;
    line-height:1.1;
}

.empty{
    color:#888;
    font-size:24px;
}

.drag-over{
    outline:4px dashed #6eb5ff;
}

.hint{
    height:30px;
    line-height:30px;
    padding-left:10px;
    color:#aaa;
    font-size:14px;
}

</style>
</head>

<body>

<div class="topbar">

    <div class="title">
        座位表（拖曳交換 / 自動儲存）
    </div>

    <div class="tools">

        <button class="btn" id="fullscreenBtn">
            全螢幕
        </button>

        <button class="btn" id="resetDefault">
            恢復預設
        </button>

        <button class="btn" id="clearAll">
            清空全表
        </button>

    </div>

</div>

<div class="desk">黑板</div>

<div id="seatGrid"></div>

<div class="hint">
拖曳姓名即可交換座位
</div>

<script>

const LS_KEY="seatGridData";

const defaultData=[
["","05周欣喬","29黃智鴻","26陳廷碩","25高詰翔","30黃  翊","19李祖瑒"],
["23洪子恩","27陳宥嘉","28黃恩加","15王若蘅","24徐譽澄","18李宥恩","14簡鈺諠"],
["16古紹伯","02王玟錦","07胡芯瑜","20林思翰","11趙若晴","13簡品嫻","03李宜宸"],
["04沈鈺睿","12謝采縈","01王予彤","31劉宸宇","33蘇昱瑾","08張祐綺","22柯宥廷"],
["09曾心澤","06洪語宸","10楊依穎","21林哲旭","32魏以恩","17吳以攸",""]
];

function parseSeats(data){

    return data.map(row=>

        row.map(item=>{

            if(!item) return null;

            const m=item.match(/^(\d+)(.+)$/);

            return {
                no:m[1],
                name:m[2]
            };

        })

    );

}

function loadSeats(){

    try{

        const saved=
        localStorage.getItem(LS_KEY);

        if(saved){

            return JSON.parse(saved);

        }

    }catch(e){}

    return parseSeats(defaultData);

}

function saveSeats(data){

    localStorage.setItem(
        LS_KEY,
        JSON.stringify(data)
    );

}

let seatData=loadSeats();

let dragSource=null;

function render(){

    const grid=
    document.getElementById("seatGrid");

    grid.innerHTML="";

    seatData.forEach((row,r)=>{

        row.forEach((person,c)=>{

            const seat=
            document.createElement("div");

            seat.className="seat";

            if(person){

                const chip=
                document.createElement("div");

                chip.className="chip";

                chip.draggable=true;

                chip.innerHTML=`
                    <div class="num">${person.no}</div>
                    <div class="name">${person.name}</div>
                `;

                chip.addEventListener(
                    "dragstart",
                    ()=>{
                        dragSource={
                            row:r,
                            col:c
                        };
                    }
                );

                seat.appendChild(chip);

            }else{

                seat.innerHTML=
                '<div class="empty">（空位）</div>';

            }

            seat.addEventListener(
                "dragover",
                (e)=>{
                    e.preventDefault();
                    seat.classList.add("drag-over");
                }
            );

            seat.addEventListener(
                "dragleave",
                ()=>{
                    seat.classList.remove("drag-over");
                }
            );

            seat.addEventListener(
                "drop",
                ()=>{

                    seat.classList.remove("drag-over");

                    if(!dragSource) return;

                    const temp=
                    seatData[r][c];

                    seatData[r][c]=
                    seatData[
                        dragSource.row
                    ][
                        dragSource.col
                    ];

                    seatData[
                        dragSource.row
                    ][
                        dragSource.col
                    ]=temp;

                    saveSeats(seatData);

                    render();
                }
            );

            grid.appendChild(seat);

        });

    });

}

document
.getElementById("resetDefault")
.onclick=()=>{

    seatData=
    parseSeats(defaultData);

    saveSeats(seatData);

    render();

};

document
.getElementById("clearAll")
.onclick=()=>{

    seatData=
    Array.from(
        {length:5},
        ()=>Array.from(
            {length:7},
            ()=>null
        )
    );

    saveSeats(seatData);

    render();

};

const fullscreenBtn =
document.getElementById("fullscreenBtn");

fullscreenBtn.onclick =
async ()=>{

    try{

        if(!document.fullscreenElement){

            await document.documentElement
                .requestFullscreen();

        }else{

            await document.exitFullscreen();

        }

    }catch(err){

        console.log(err);

    }

};

document.addEventListener(
    "fullscreenchange",
    ()=>{

        fullscreenBtn.textContent=
        document.fullscreenElement
        ? "離開全螢幕"
        : "全螢幕";

    }
);

document.addEventListener(
    "click",
    ()=>{

        if(!document.fullscreenElement){

            document.documentElement
            .requestFullscreen()
            .catch(()=>{});

        }

    },
    {once:true}
);

render();

</script>

</body>
</html>
