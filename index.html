<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>座位表</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}
#viewport{position:fixed;inset:0;overflow:hidden;background:#000}
#stage-wrap{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:top left}
#stage{width:1920px;height:1080px;padding:20px;display:flex;flex-direction:column;background:#000}
.topbar{height:92px;flex:0 0 92px;display:flex;justify-content:space-between;align-items:center;padding:0 10px 12px}
.title{font-size:48px;font-weight:700;white-space:nowrap}
.tools{display:flex;gap:12px;white-space:nowrap}
.btn{padding:12px 20px;font-size:22px;border:1px solid #4165bd;border-radius:10px;background:#2348aa;color:#fff;cursor:pointer}
.btn:active{background:#3567df}
.desk{height:94px;flex:0 0 94px;display:flex;align-items:center;justify-content:center;background:#446bb0;border:1px solid #90a7d3;font-size:56px;font-weight:700}
#seatGrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:2px;background:#3d4d74}
.seat{min-width:0;min-height:0;padding:7px;display:flex;align-items:center;justify-content:center;background:#121a2b;overflow:hidden}
.chip{width:96%;height:92%;padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #254da6;border-radius:12px;background:#06152d;cursor:grab;user-select:none;overflow:hidden}
.num{font-size:25px;font-weight:700;line-height:1;white-space:nowrap}
.name{margin-top:5px;font-size:42px;line-height:1.08;text-align:center;white-space:nowrap}
.empty{color:#888;font-size:25px;white-space:nowrap}
.drag-over{outline:4px dashed #6eb5ff;outline-offset:-4px}
.hint{height:28px;flex:0 0 28px;padding-left:8px;color:#aaa;font-size:15px;line-height:28px}
#rotateHint{display:none;position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;padding:8px 14px;border-radius:20px;background:rgba(20,30,50,.9);color:#fff;font-size:14px;white-space:nowrap}
@media (orientation:portrait) and (max-width:800px){#rotateHint{display:block}}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage-wrap">
    <main id="stage">
      <header class="topbar">
        <div class="title">座位表（拖曳交換 / 自動儲存）</div>
        <div class="tools">
          <button class="btn" id="fullscreenBtn" type="button">全螢幕</button>
          <button class="btn" id="resetDefault" type="button">恢復預設</button>
          <button class="btn" id="clearAll" type="button">清空全表</button>
        </div>
      </header>
      <div class="desk">黑板</div>
      <div id="seatGrid"></div>
      <div class="hint">拖曳姓名即可交換座位</div>
    </main>
  </div>
</div>
<div id="rotateHint">橫向觀看可獲得較大的座位表</div>
<script>
"use strict";
const DESIGN_W=1920,DESIGN_H=1080;
function fitStage(){
  const vv=window.visualViewport;
  const vw=vv?vv.width:window.innerWidth;
  const vh=vv?vv.height:window.innerHeight;
  const scale=Math.min(vw/DESIGN_W,vh/DESIGN_H);
  const x=Math.max(0,(vw-DESIGN_W*scale)/2)+(vv?vv.offsetLeft:0);
  const y=Math.max(0,(vh-DESIGN_H*scale)/2)+(vv?vv.offsetTop:0);
  document.getElementById("stage-wrap").style.transform=`translate(${x}px,${y}px) scale(${scale})`;
}
window.addEventListener("resize",fitStage);
window.addEventListener("orientationchange",()=>setTimeout(fitStage,250));
if(window.visualViewport){window.visualViewport.addEventListener("resize",fitStage);window.visualViewport.addEventListener("scroll",fitStage)}

const LS_KEY="seatGridData-v2";
const defaultData=[
["", "20林思翰", "13簡品嫻", "21林哲旭", "02王玟錦", "28黃恩加", "24徐譽澄"],
["31劉宸宇", "07胡芯瑜", "11趙若晴", "06洪語宸", "08張祐綺", "22柯宥廷", "32魏以恩"],
["25高詰翔", "30黃  翊", "33蘇昱瑋", "17吳以攸", "23洪子恩", "01王予彤", "12謝采縈"],
["18李宥恩", "04沈鈺叡", "14簡鈺諠", "26陳廷碩", "03李宜宸", "10楊依穎", "15王若蘅"],
["05周欣喬", "09曾心澤", "29黃智鴻", "27陳宥嘉", "19李祖瑒", "16古紹伯", ""]
];
function parseSeats(data){return data.map(row=>row.map(item=>{const s=String(item||"").trim();if(!s)return null;const m=s.match(/^(\d+)(.+)$/);return m?{no:m[1],name:m[2].trim()}:{no:"",name:s}}))}
function validGrid(data){return Array.isArray(data)&&data.length===5&&data.every(r=>Array.isArray(r)&&r.length===7)}
function loadSeats(){try{const data=JSON.parse(localStorage.getItem(LS_KEY));if(validGrid(data))return data}catch(e){}return parseSeats(defaultData)}
function saveSeats(data){try{localStorage.setItem(LS_KEY,JSON.stringify(data))}catch(e){console.warn(e)}}
let seatData=loadSeats(),dragSource=null;
const grid=document.getElementById("seatGrid");
function render(){
 grid.innerHTML="";
 seatData.forEach((row,r)=>row.forEach((person,c)=>{
  const seat=document.createElement("div");seat.className="seat";seat.dataset.row=r;seat.dataset.col=c;
  if(person){const chip=document.createElement("div");chip.className="chip";chip.draggable=true;
   const num=document.createElement("div");num.className="num";num.textContent=person.no||"";
   const name=document.createElement("div");name.className="name";name.textContent=person.name||"";
   chip.append(num,name);chip.addEventListener("dragstart",e=>{dragSource={row:r,col:c};e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",`${r},${c}`)});
   chip.addEventListener("dragend",()=>{dragSource=null;document.querySelectorAll(".drag-over").forEach(el=>el.classList.remove("drag-over"))});seat.appendChild(chip)
  }else{const empty=document.createElement("div");empty.className="empty";empty.textContent="（空位）";seat.appendChild(empty)}
  seat.addEventListener("dragover",e=>{e.preventDefault();seat.classList.add("drag-over")});
  seat.addEventListener("dragleave",()=>seat.classList.remove("drag-over"));
  seat.addEventListener("drop",e=>{e.preventDefault();seat.classList.remove("drag-over");if(!dragSource)return;const temp=seatData[r][c];seatData[r][c]=seatData[dragSource.row][dragSource.col];seatData[dragSource.row][dragSource.col]=temp;dragSource=null;saveSeats(seatData);render()});
  grid.appendChild(seat)
 }))
}
document.getElementById("resetDefault").addEventListener("click",()=>{seatData=parseSeats(defaultData);saveSeats(seatData);render()});
document.getElementById("clearAll").addEventListener("click",()=>{seatData=Array.from({length:5},()=>Array(7).fill(null));saveSeats(seatData);render()});
const fullscreenBtn=document.getElementById("fullscreenBtn");
fullscreenBtn.addEventListener("click",async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen()}else{await document.exitFullscreen()}}catch(e){console.warn("無法切換全螢幕",e)}finally{setTimeout(fitStage,100)}});
document.addEventListener("fullscreenchange",()=>{fullscreenBtn.textContent=document.fullscreenElement?"離開全螢幕":"全螢幕";setTimeout(fitStage,100)});
fitStage();render();
</script>
</body>
</html>
