<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>各科小老師</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}#viewport{position:fixed;inset:0;overflow:hidden}#wrap{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:top left}main{width:1920px;height:1080px;padding:20px;display:flex;flex-direction:column}.topbar{height:90px;display:flex;align-items:center;justify-content:space-between;gap:16px}.title{font-size:48px;font-weight:700}.tools{display:flex;gap:12px}.btn{padding:12px 20px;border:1px solid #4165bd;border-radius:10px;background:#2348aa;color:#fff;font-size:22px}.table-wrap{flex:1;min-height:0}table{width:100%;height:100%;border-collapse:collapse;table-layout:fixed}thead th{height:88px;background:#446bb0;border:1px solid #90a7d3;font-size:52px}tbody tr{height:12.5%}td{padding:6px;border:1px solid #303b52;background:#0b0f16;text-align:center;vertical-align:middle;overflow:hidden}tr:nth-child(even) td{background:#202020}.chip{width:96%;height:90%;margin:auto;display:flex;align-items:center;justify-content:center;border:1px solid #24406f;border-radius:12px;background:#101827;cursor:grab;user-select:none}.text{font-size:40px;line-height:1.1;white-space:nowrap}.subject{color:#ff4f1f;font-weight:800}.empty{color:#888;font-size:25px}.drag-over{outline:4px dashed #6eb5ff;outline-offset:-4px}.hint{height:27px;color:#aaa;font-size:15px;line-height:27px}
</style>
</head>
<body>
<div id="viewport"><div id="wrap"><main>
<header class="topbar"><div class="title">各科小老師（拖曳交換 / 自動儲存）</div><div class="tools"><button class="btn" id="full">全螢幕</button><button class="btn" id="reset">恢復預設</button><button class="btn" id="clear">清空全表</button></div></header>
<div class="table-wrap"><table><thead><tr><th colspan="7">各科小老師</th></tr></thead><tbody id="body"></tbody></table></div><div class="hint">提示：可拖曳內容交換位置；觸控拖曳支援依瀏覽器而定。</div>
</main></div></div>
<script>
"use strict";
const W=1920,H=1080,ROWS=8,COLS=7,KEY="subject-assistant-grid-v2";
const defaults=[
["國文","英語","健康","數學","自然","表演","歷史"],
["王予彤","高詰翔","簡品嫻","林思翰","曾心澤","劉宸宇","古紹伯"],
["美術","音樂","地理","童軍","體育器材","公民","家政"],
["陳宥嘉","李祖瑒","李宥恩","胡芯瑜","吳以攸","","洪語宸"],
["魏以恩","徐譽澄","王若蘅","王玟錦","洪子恩","黃翊","謝采縈"],
["生科","本土語","","","趙若晴","陳廷碩","沈鈺叡"],
["","","黃恩加","","蘇昱瑋","張祐綺","柯宥廷"],
["","","楊依穎","黃智鴻","周欣喬","李宜宸","林思翰"]];
const subjects=new Set(["國文","英語","健康","數學","自然","表演","歷史","美術","音樂","地理","童軍","體育器材","公民","家政","生科","本土語","體育"]);
function fit(){const v=visualViewport,w=v?v.width:innerWidth,h=v?v.height:innerHeight,s=Math.min(w/W,h/H),x=(w-W*s)/2+(v?v.offsetLeft:0),y=(h-H*s)/2+(v?v.offsetTop:0);document.getElementById("wrap").style.transform=`translate(${x}px,${y}px) scale(${s})`}
addEventListener("resize",fit);addEventListener("orientationchange",()=>setTimeout(fit,250));if(visualViewport){visualViewport.addEventListener("resize",fit);visualViewport.addEventListener("scroll",fit)}
const clone=()=>defaults.map(r=>[...r]);const valid=d=>Array.isArray(d)&&d.length===ROWS&&d.every(r=>Array.isArray(r)&&r.length===COLS);function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(valid(d))return d}catch(e){}return clone()}function save(){localStorage.setItem(KEY,JSON.stringify(data))}
let data=load(),from=null;const body=document.getElementById("body");
function render(){body.innerHTML="";data.forEach((row,r)=>{const tr=document.createElement("tr");row.forEach((txt,c)=>{const td=document.createElement("td");if(txt){const chip=document.createElement("div"),sp=document.createElement("div");chip.className="chip";chip.draggable=true;sp.className="text"+(subjects.has(txt)?" subject":"");sp.textContent=txt;chip.appendChild(sp);chip.ondragstart=e=>{from={r,c};e.dataTransfer.setData("text/plain",`${r},${c}`)};chip.ondragend=()=>from=null;td.appendChild(chip)}else{td.innerHTML='<div class="empty">（空位）</div>'}td.ondragover=e=>{e.preventDefault();td.classList.add("drag-over")};td.ondragleave=()=>td.classList.remove("drag-over");td.ondrop=e=>{e.preventDefault();td.classList.remove("drag-over");if(!from)return;[data[r][c],data[from.r][from.c]]=[data[from.r][from.c],data[r][c]];from=null;save();render()};tr.appendChild(td)});body.appendChild(tr)})}
document.getElementById("reset").onclick=()=>{data=clone();save();render()};document.getElementById("clear").onclick=()=>{data=Array.from({length:ROWS},()=>Array(COLS).fill(""));save();render()};const full=document.getElementById("full");full.onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch(e){}setTimeout(fit,100)};document.addEventListener("fullscreenchange",()=>{full.textContent=document.fullscreenElement?"離開全螢幕":"全螢幕";setTimeout(fit,100)});fit();render();
</script>
</body></html>
